server:
  port: 8080

spring:
  application:
    name: api-gateway1
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: customer-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/customers/**
              filters:
                - AddResponseHeader=X-Served-By, api-gateway1

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway